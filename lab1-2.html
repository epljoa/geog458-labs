<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoiZXBsam9hIiwiYSI6ImNtdXp2bHhocTAwMTcyeXByeG1neGs3bWgifQ.gD-Q8YP6w11yzlrBOrkQXQ';
      const mymap = new mapboxgl.Map({
             container: 'map',
             style: 'mapbox://styles/mapbox/satellite-v9',
             projection: 'equalEarth', //Display the map as a globe since satellite-v9 defaults to Mercator
             center: [-122.3032, 47.6555],
             zoom:14
          });

    mymap.addControl(new mapboxgl.FullscreenControl());
    mymap.addControl(new mapboxgl.NavigationControl());


// code from the next step will go here!
</script>
</body>
</html>
